# Secret: app-db-secret
# Holds the production database password, injected into the python-app
# container via envFrom.secretRef (see app-deployment.yml).
# config.py reads DATABASE_PASSWORD and substitutes it into the "%s" in
# DATABASE_URI (set in the app-config ConfigMap).
#
# SECURITY NOTE: stringData stores the value in plain text in this manifest.
# For anything beyond this POC, source the password from an external secret
# store (e.g. External Secrets Operator / Vault) instead of committing it.
apiVersion: v1
kind: Secret
metadata:
  name: app-db-secret
  namespace: ks-hybrid-cloud-poc
type: Opaque
stringData:
  DATABASE_PASSWORD: "P@ssw0rd"
