# Secret: app-db-secret
# Database password for the on-prem environment (namespace rosa-poc).
#
# NOTE: the on-prem deployment runs the "test" profile, which connects to
# the in-cluster MSSQL (database:1433) using credentials hardcoded in the
# profile config in app/config.py. The test profile does NOT read
# DATABASE_PASSWORD, so this Secret is provided for parity with the cloud
# manifests and is not consumed unless the deployment is switched to the
# production profile and wired via envFrom.secretRef (see oc/cloud/).
#
# SECURITY NOTE: stringData stores the value in plain text in this manifest.
# For anything beyond this POC, source the password from an external secret
# store (e.g. External Secrets Operator / Vault) instead of committing it.
apiVersion: v1
kind: Secret
metadata:
  name: app-db-secret
  namespace: rosa-poc
type: Opaque
stringData:
  DATABASE_PASSWORD: "P@ssw0rd"
