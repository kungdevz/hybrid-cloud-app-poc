# App Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: rosa-poc
  name: python-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-app
  template:
    metadata:
      labels:
        app: python-app
    spec:
      containers:
        - name: app
          # Set <HARBOR_REGISTRY> to your private registry host before applying
          # (e.g. registry.example.internal). The harbor-pull-secret below must
          # hold credentials for that same registry.
          image: <HARBOR_REGISTRY>/kscloud/rosa-app:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          ports:
            - containerPort: 5000
          # Load environment variables from both the ConfigMap and the Secret.
          # ConfigMap (app-config): PROFILE, FLASK_APP, DATABASE_URI (no secrets).
          # Secret (app-db-secret): DATABASE_PASSWORD (kept out of the ConfigMap).
          # config.py substitutes DATABASE_PASSWORD into the "%s" in DATABASE_URI.
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-db-secret
      imagePullSecrets:
      - name: harbor-pull-secret
